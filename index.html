<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modern To-Do List App</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:linear-gradient(135deg,#667eea,#764ba2);
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    transition:.4s;
}

body.dark{
    background:linear-gradient(135deg,#141E30,#243B55);
}

.container{
    width:430px;
    background:white;
    border-radius:18px;
    padding:25px;
    box-shadow:0 10px 30px rgba(0,0,0,.25);
    animation:fade .5s;
}

body.dark .container{
    background:#2c2c2c;
    color:white;
}

@keyframes fade{
    from{
        opacity:0;
        transform:translateY(30px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

h1{
    color:#4a4ae6;
}

body.dark h1{
    color:#8ab4ff;
}

#themeBtn{
    padding:8px 12px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    background:#444;
    color:white;
    font-size:18px;
}

.input-area{
    display:flex;
    margin-top:20px;
    gap:10px;
}

input{
    flex:1;
    padding:12px;
    border-radius:8px;
    border:1px solid #ccc;
    font-size:15px;
}

#addBtn{
    background:#4a4ae6;
    color:white;
    border:none;
    padding:12px 18px;
    border-radius:8px;
    cursor:pointer;
}

#addBtn:hover{
    background:#3737d4;
}

.stats{
    display:flex;
    justify-content:space-between;
    margin:18px 0;
    font-weight:bold;
}

ul{
    list-style:none;
}

li{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:#f1f1f1;
    padding:12px;
    border-radius:10px;
    margin-bottom:10px;
}

body.dark li{
    background:#444;
}

.task{
    flex:1;
    cursor:pointer;
    word-break:break-word;
}

.completed{
    text-decoration:line-through;
    color:gray;
}

.actions button{
    margin-left:5px;
    border:none;
    padding:6px 10px;
    border-radius:6px;
    cursor:pointer;
}

.edit{
    background:orange;
    color:white;
}

.delete{
    background:red;
    color:white;
}

#clearBtn{
    width:100%;
    margin-top:15px;
    background:#28a745;
    color:white;
    border:none;
    padding:12px;
    border-radius:8px;
    cursor:pointer;
}

#clearBtn:hover{
    background:#218838;
}
</style>
</head>

<body>

<div class="container">

<div class="header">
<h1>📝 To-Do List</h1>
<button id="themeBtn">🌙</button>
</div>

<div class="input-area">
<input type="text" id="taskInput" placeholder="Enter a task">
<button id="addBtn">Add</button>
</div>

<div class="stats">
<span>Total: <span id="total">0</span></span>
<span>Completed: <span id="completed">0</span></span>
<span>Pending: <span id="pending">0</span></span>
</div>

<ul id="taskList"></ul>

<button id="clearBtn">🧹 Clear Completed Tasks</button>

</div>

<script>

const taskInput=document.getElementById("taskInput");
const addBtn=document.getElementById("addBtn");
const taskList=document.getElementById("taskList");
const themeBtn=document.getElementById("themeBtn");
const clearBtn=document.getElementById("clearBtn");

addBtn.addEventListener("click",addTask);

taskInput.addEventListener("keypress",function(e){
    if(e.key==="Enter"){
        addTask();
    }
});

themeBtn.addEventListener("click",function(){

    document.body.classList.toggle("dark");

    if(document.body.classList.contains("dark")){
        themeBtn.innerHTML="☀️";
    }else{
        themeBtn.innerHTML="🌙";
    }

});

function addTask(){

    let text=taskInput.value.trim();

    if(text===""){
        alert("Please enter a task.");
        return;
    }

    let li=document.createElement("li");

    let span=document.createElement("span");
    span.className="task";
    span.innerText=text;

    span.addEventListener("click",function(){
        span.classList.toggle("completed");
        updateStats();
    });

    let actions=document.createElement("div");
    actions.className="actions";

    let edit=document.createElement("button");
    edit.className="edit";
    edit.innerHTML="✏️";

    edit.addEventListener("click",function(){

        let updated=prompt("Edit Task",span.innerText);

        if(updated!==null && updated.trim()!==""){
            span.innerText=updated.trim();
        }

    });

    let del=document.createElement("button");
    del.className="delete";
    del.innerHTML="🗑️";

    del.addEventListener("click",function(){

        li.remove();
        updateStats();

    });

    actions.appendChild(edit);
    actions.appendChild(del);

    li.appendChild(span);
    li.appendChild(actions);

    taskList.appendChild(li);

    taskInput.value="";
    taskInput.focus();

    updateStats();

}

clearBtn.addEventListener("click",function(){

    const completedTasks=document.querySelectorAll(".completed");

    completedTasks.forEach(function(task){

        task.closest("li").remove();

    });

    updateStats();

});

function updateStats(){

    const total=document.querySelectorAll("#taskList li").length;
    const completed=document.querySelectorAll("#taskList .completed").length;
    const pending=total-completed;

    document.getElementById("total").innerText=total;
    document.getElementById("completed").innerText=completed;
    document.getElementById("pending").innerText=pending;

}

</script>

</body>
</html>
